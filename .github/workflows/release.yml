name: release

on:
  push:
    tags: ['v*']

# Only the last job, which runs no third-party action, can publish.
permissions:
  contents: read

# One run per tag at a time, and never cancelled halfway: two runs for the
# same tag would both find no release and both try to create it.
concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: refuse a tag that is not a version on main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag name is data from whoever pushed it, so it reaches the shell
      # as an environment variable and is checked before anything uses it.
      # Only semantic versions the Go toolchain accepts as a module version.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::not a semantic version tag: $TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi

  # The Go module proxy caches a version forever once anyone fetches it, so
  # a tag cannot be taken back, only superseded. The whole test workflow runs
  # again on the tagged commit rather than trusting that it ran before.
  verify:
    name: verify
    needs: guard
    uses: ./.github/workflows/tests.yml

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # What was verified is the commit this run started on.
          if [ "$(git rev-parse "$TAG^{commit}")" != "$SHA" ]; then
            echo "::error::$TAG moved while it was being verified; push it again to re-run"
            exit 1
          fi

          prerelease=false
          if printf '%s' "$TAG" | grep -q -- '-'; then
            prerelease=true
          fi

          # Notes run from the highest version tag this one descends from and,
          # for a stable release, the highest STABLE one.
          previous=''
          for candidate in $(git -c versionsort.suffix=- tag --merged "$TAG^" --list 'v[0-9]*' --sort=-version:refname 2>/dev/null || true); do
            if [ "$prerelease" = false ] && printf '%s' "$candidate" | grep -q -- '-'; then
              continue
            fi
            previous=$candidate
            break
          done
          if [ -n "$previous" ]; then
            notes=$(git log --no-merges --pretty='- %s' "$previous..$TAG")
            body=$(printf '## Changes since %s\n\n%s' "$previous" "$notes")
          else
            body='First release.'
          fi

          # An annotated tag's message leads the notes: it says what the
          # release is, the commit list only what changed.
          annotation=$(git tag -l "$TAG" --format='%(contents)')
          if [ -n "$annotation" ]; then
            body=$(printf '%s\n\n%s' "$annotation" "$body")
          fi

          action=create
          if gh release view "$TAG" >/dev/null 2>&1; then
            action=edit
          fi

          gh release "$action" "$TAG" \
            --title "$TAG" \
            --notes "$body" \
            --prerelease="$prerelease" \
            --verify-tag

      # Unlike Packagist there is no hook to fail silently: the proxy fetches
      # a version on first request. Asking for it here both warms the cache
      # and proves the tag resolves as a module version from outside.
      - name: Check the module proxy serves the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          module=$(awk '/^module /{print $2; exit}' go.mod)
          for attempt in $(seq 1 20); do
            if curl -fsS "https://proxy.golang.org/${module}/@v/${TAG}.info"; then
              echo
              exit 0
            fi
            echo "attempt $attempt: the proxy does not serve $TAG yet"
            sleep 15
          done
          echo "::error::proxy.golang.org never served ${module}@${TAG}"
          exit 1
